<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHOP.CO - Product Detail</title>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./scss/style.css">
</head>
<body>

  <!-- верхняя черная строка -->
  <div class="top-bar">
    <p class="top-bar__text">
      Sign up and get 20% off to your first order. 
      <a href="#">Sign Up Now</a>
    </p>
    <button type="button" class="top-bar__close" aria-label="close">
      <img src="./assest/icons/Cross.svg" alt="close">
    </button>
  </div>

  <!-- шапка сайта -->
  <header class="header">
    <div class="header__inner">
      <div class="header__logo">
        <a href="index.html">
          <img src="./assest/icons/SHOP.CO.svg" alt="SHOP.CO">
        </a>
      </div>

      <nav class="header__nav">
        <a href="index.html">Shop <img src="./assest/icons/CornerDown.svg" alt="down"></a>
        <a href="#">On Sale</a>
        <a href="#">New Arrivals</a>
        <a href="#">Brands</a>
      </nav>

      <form action="/search" method="get" class="header__search">
        <img src="./assest/icons/Loop.svg" alt="search">
        <input type="search" placeholder="Search for products...">
      </form>

      <div class="header__actions">
        <a href="#" aria-label="cart">
          <img src="./assest/icons/Cart.svg" alt="cart">
        </a>
        <a href="#" aria-label="profile">
          <img src="./assest/icons/Profile.svg" alt="profile">
        </a>
      </div>
    </div>
    <hr class="header__divider">
  </header>

  <main class="product-page">
    <div class="catalog-layout" style="flex-direction: column;">
      <!-- крошкэ -->
      <nav class="breadcrumbs" aria-label="breadcrumbs">
        <a href="index.html">Home</a>
        <img src="./assest/icons/CornerRight.svg" alt="arrow">
        <a href="index.html">Shop</a>
        <img src="./assest/icons/CornerRight.svg" alt="arrow">
        <span id="detailBreadcrumbTitle">T-shirt</span>
      </nav>

      <!-- блок отображения товара из js -->
      <section class="product-card" style="display: flex; flex-direction: row; gap: 40px; margin-top: 20px;" id="productDetailSection">
        <!-- контент генерируется скриптом js/product.js -->
      </section>
    </div>
  </main>

  <!-- футер -->
  <footer class="footer" style="margin-top: 80px;">
    <div class="footer__main">
      <div class="footer__brand">
        <a href="index.html">
          <img src="./assest/icons/SHOP.CO.svg" alt="SHOP.CO" class="footer__logo-img">
        </a>
        <p>We have clothes that suits your style and which you’re proud to wear.</p>
      </div>
    </div>
    <hr class="footer__divider">
    <div class="footer__bottom">
      <p>Shop.co © 2000-2023, All Rights Reserved</p>
    </div>
  </footer>

  <script type="module" src="js/product.js"></script>
</body>
</html>
